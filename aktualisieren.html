<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>Offline-Version aktualisieren | Elecalculate</title><style>
body{font:15px/1.8 Arial,sans-serif;background:#000;color:#eee;max-width:650px;margin:8vh auto;padding:25px}h1{font-size:26px;line-height:1.4}p{color:#bbb}button,a{font:inherit;color:#eee}button{background:#303030;border:1px solid #666;border-radius:4px;padding:10px 16px;cursor:pointer;margin:10px 10px 10px 0}button:disabled{opacity:.6;cursor:wait}button:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:4px}#status{min-height:3em;color:#eee}#activate[hidden]{display:none}
</style></head><body><h1>Offline-Version aktualisieren</h1><p>Wenn eine ältere gespeicherte Version hängen bleibt, kannst du hier die aktuellen Dateien laden. Gespeicherte Notizen bleiben erhalten. Sichere vorher noch offene Eingaben im Notizbuch.</p><button id="check">Aktuelle Dateien laden</button><button id="activate" hidden>Jetzt aktualisieren</button><p id="status" role="status"></p><p><a href="/">Zur Website</a></p><script>
(()=>{const build="504e81c30e7ed13ef35c4322ef991f94601c2404";if(!('serviceWorker' in navigator))return;const acknowledge=()=>navigator.serviceWorker.controller?.postMessage({type:'ELECALCULATE_CLIENT_READY',build});navigator.serviceWorker.addEventListener('message',event=>{if(event.data?.type==='ELECALCULATE_BUILD_REQUEST')acknowledge();});navigator.serviceWorker.addEventListener('controllerchange',acknowledge);window.addEventListener('pageshow',acknowledge);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')acknowledge();});acknowledge();})();
const check=document.getElementById('check');const activate=document.getElementById('activate');const status=document.getElementById('status');let waiting=null;
async function deadline(operation){let timeout;try{return await Promise.race([operation,new Promise((_,reject)=>{timeout=setTimeout(()=>reject(new Error()),90000);})]);}finally{clearTimeout(timeout);}}
async function installed(reg){const worker=reg.installing||reg.waiting;if(!worker||worker.state==='installed'||worker.state==='activated')return;await new Promise((resolve,reject)=>{const timeout=setTimeout(()=>finish(new Error()),90000);const changed=()=>{if(worker.state==='installed'||worker.state==='activated')finish();else if(worker.state==='redundant')finish(new Error());};function finish(error){clearTimeout(timeout);worker.removeEventListener('statechange',changed);error?reject(error):resolve();}worker.addEventListener('statechange',changed);changed();});}
check.addEventListener('click',async()=>{check.disabled=true;activate.hidden=true;status.textContent='Aktuelle Offline-Dateien werden gespeichert.';try{if(!('serviceWorker' in navigator))throw new Error();const reg=await deadline(navigator.serviceWorker.register('/sw.js?update='+Date.now(),{scope:'/',updateViaCache:'none'}));await installed(reg);waiting=reg.waiting;if(waiting){activate.hidden=false;status.textContent='Die aktuellen Dateien sind vollständig gespeichert. Wähle „Jetzt aktualisieren“, um sie zu verwenden.';}else if(reg.active){status.textContent='Die aktuelle Offline-Version ist bereit. Du kannst zur Website zurückkehren.';}else throw new Error();}catch{status.textContent='Die Dateien konnten nicht vollständig geladen werden. Prüfe die Internetverbindung und versuche es erneut. Vorhandene Notizen werden nicht verändert.';}finally{check.disabled=false;}});
activate.addEventListener('click',()=>{if(!waiting)return;if(waiting.state==='activated'){location.assign('/');return;}activate.disabled=true;status.textContent='Die neue Version wird aktiviert.';const changed=()=>{clearTimeout(timeout);navigator.serviceWorker.removeEventListener('controllerchange',changed);location.assign('/');};navigator.serviceWorker.addEventListener('controllerchange',changed);const timeout=setTimeout(()=>{navigator.serviceWorker.removeEventListener('controllerchange',changed);activate.disabled=false;status.textContent='Die Aktivierung dauert länger. Versuche es erneut oder öffne die Website neu.';},15000);waiting.postMessage({type:'ELECALCULATE_ACTIVATE_UPDATE'});});
</script></body></html>
